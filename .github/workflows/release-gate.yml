name: Release gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional deployed URL; leave blank to run all browser flows against the checked-out ref
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Node regression tests
        run: npm test
      - name: Verify level-pack exports
        run: node scripts/export-level-packs.js --check
      - name: Parse committed pack JSON
        run: |
          node -e "for (const file of ['packs/index.json','packs/legacy/manifest.json','packs/legacy/presets.json','packs/legacy/levels.json','packs/balanced-v2/manifest.json','packs/balanced-v2/presets.json','packs/balanced-v2/levels.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))"
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser verification
        shell: bash
        run: |
          if [[ -n "$PLAYWRIGHT_TEST_BASE_URL" ]]; then
            npx playwright test e2e/startup.spec.js --project=chromium
          else
            npm run test:e2e
          fi
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-playwright-report
          path: playwright-report/
          retention-days: 30
