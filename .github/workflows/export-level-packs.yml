name: Export level packs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify committed JSON packs match migration sources
        run: node scripts/export-level-packs.js --check
      - name: Parse generated JSON
        run: |
          node -e "for (const file of ['packs/index.json','packs/legacy/manifest.json','packs/legacy/presets.json','packs/legacy/levels.json','packs/balanced-v2/manifest.json','packs/balanced-v2/presets.json','packs/balanced-v2/levels.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))"
