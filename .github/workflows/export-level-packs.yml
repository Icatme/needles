name: Export level packs

on:
  pull_request:
    paths:
      - 'js/data/levels.js'
      - 'js/data/balancedLevels.js'
      - 'scripts/export-level-packs.js'
      - '.github/workflows/export-level-packs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate JSON packs
        run: node scripts/export-level-packs.js
      - name: Verify generated JSON
        run: |
          node -e "for (const file of ['packs/index.json','packs/legacy/manifest.json','packs/legacy/presets.json','packs/legacy/levels.json','packs/balanced-v2/manifest.json','packs/balanced-v2/presets.json','packs/balanced-v2/levels.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))"
      - name: Commit generated packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs
          if git diff --cached --quiet; then
            echo "Generated packs are up to date."
          else
            git commit -m "Generate JSON level packs"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: generated-level-packs
          path: packs
          if-no-files-found: error
