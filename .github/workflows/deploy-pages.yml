name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Node regression tests
        run: npm test
      - name: Verify level-pack exports
        run: node scripts/export-level-packs.js --check
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run local browser flows
        run: npm run test:e2e
      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js packs assets _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Upload local Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: pre-deploy-playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deployed-smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Smoke-test deployed site
        run: npx playwright test e2e/startup.spec.js --project=chromium
      - name: Upload deployed smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: deployed-playwright-report
          path: playwright-report/
          retention-days: 30
